<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mango Center - Цэс & Захиалга</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <style>
        * { box-sizing: border-box; }
        body {
            background: #f4f6f9;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #222;
            padding-bottom: 110px;
        }

        /* ЦЭС */
        nav {
            background-color: #1a1a1a;
            padding: 18px 10px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 12px;
            font-size: 18px;
            font-weight: 700;
            transition: 0.3s;
        }
        nav a:hover, nav a.active { color: #FFD200; }

        /* ТАБ ТОВЧЛУУРУУД */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            position: sticky;
            top: 58px;
            z-index: 999;
        }
        .tab-btn {
            background: #eef1f6;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background: #FFD200;
            color: #111;
            box-shadow: 0 4px 12px rgba(255, 210, 0, 0.4);
        }

        /* КАРТУУД */
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .item-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .item-card:hover { transform: translateY(-4px); }
        .item-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .item-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .item-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .item-desc { font-size: 13px; color: #666; margin-bottom: 12px; }
        .item-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .item-price { font-weight: bold; font-size: 16px; color: #e67e22; }
        
        /* COUNTER BOX */
        .counter-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f1f3f5;
            padding: 4px 8px;
            border-radius: 10px;
        }
        .count-btn {
            background: #1a1a1a;
            color: #FFD200;
            border: none;
            width: 26px; height: 26px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .count-btn:hover { background: #333; }
        .count-num { font-weight: bold; font-size: 14px; min-width: 18px; text-align: center; }

        .add-btn {
            background: #1a1a1a;
            color: #FFD200;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-btn:hover { background: #333; }

        /* MODAL POP-UP ЦОНХ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
        }
        .modal-img { width: 100%; height: 220px; object-fit: cover; }
        .modal-content { padding: 20px; }
        .modal-title { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
        .modal-detail { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 20px; }
        .modal-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        /* ХӨВӨГЧ САГС */
        .floating-cart {
            position: fixed;
            bottom: 20px; left: 15px; right: 15px;
            max-width: 500px;
            margin: 0 auto;
            background: #1a1a1a;
            color: white;
            padding: 15px 20px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .cart-btn {
            background: #FFD200;
            color: #111;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* ЧЕК POPUP */
        .receipt-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .receipt-box {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 360px;
            color: #000;
            font-family: 'Courier New', Courier, monospace;
        }

        /* SUCCESS POPUP */
        .success-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
            padding: 20px;
        }
        .success-box {
            background: #fff;
            padding: 30px 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .success-icon {
            width: 70px;
            height: 70px;
            background: #2ec4b6;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: 0 auto 15px auto;
            box-shadow: 0 6px 15px rgba(46, 196, 182, 0.4);
        }

        [data-netlify-badge], .netlify-badge, #netlify-badge { display: none !important; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Нүүр хуудас</a>
        <a href="menu.html" class="active">Үйлчилгээ & Цэс</a>
        <a href="about.html">Бидний тухай</a>
    </nav>

    <!-- ТАБУУД -->
    <div class="category-tabs">
        <button class="tab-btn active" onclick="filterCategory('all', event)">Бүгд</button>
        <button class="tab-btn" onclick="filterCategory('coffee', event)">☕ Кофе</button>
        <button class="tab-btn" onclick="filterCategory('food', event)">🍔 Ресторан</button>
        <button class="tab-btn" onclick="filterCategory('karaoke', event)">🎤 Караоке</button>
        <button class="tab-btn" onclick="filterCategory('hotel', event)">🏨 Буудал</button>
    </div>

    <!-- КАРТУУД -->
    <div class="container" id="menu-items"></div>

    <!-- MODAL POP-UP -->
    <div class="modal-overlay" id="itemModal" onclick="closeModalBg(event)">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <img id="mImg" class="modal-img" src="" alt="">
            <div class="modal-content">
                <div id="mTitle" class="modal-title"></div>
                <div id="mDetail" class="modal-detail"></div>
                <div class="modal-action">
                    <span id="mPrice" class="item-price"></span>
                    <div id="mActionArea"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ХӨВӨГЧ САГС -->
    <div class="floating-cart">
        <div>
            <div style="font-size: 12px; color: #aaa;">Нийт захиалга:</div>
            <div style="font-size: 18px; font-weight: bold; color: #FFD200;" id="cartTotal">0 ₮</div>
        </div>
        <button class="cart-btn" onclick="showReceipt()">Захиалах / Чек харах</button>
    </div>

    <!-- ЧЕК POPUP -->
    <div class="receipt-overlay" id="receiptModal">
        <div class="receipt-box">
            <h3 style="text-align: center; margin-top: 0;">MANGO CENTER</h3>
            <p style="text-align: center; font-size: 12px;">Таны захиалгын баримт</p>
            <hr>
            <div id="receiptItems"></div>
            <hr>
            <h3 style="display: flex; justify-content: space-between;">
                <span>НИЙТ:</span>
                <span id="receiptTotal">0 ₮</span>
            </h3>
            <button id="checkoutBtn" class="add-btn" style="width: 100%; margin-top: 15px; padding: 12px; font-size: 15px;" onclick="confirmOrder()">Захиалга баталгаажуулах</button>
            <button class="add-btn" style="width: 100%; margin-top: 8px; background: #666; color: white;" onclick="closeReceipt()">Буцах</button>
        </div>
    </div>

    <!-- SUCCESS POPUP -->
    <div class="success-overlay" id="successModal">
        <div class="success-box">
            <div class="success-icon">✓</div>
            <h2 style="margin: 0 0 10px 0; font-size: 22px; color: #111;">Захиалга амжилттай!</h2>
            <p style="font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.5;">Таны захиалгыг хүлээн авлаа. Баярлалаа!</p>
            <button class="add-btn" style="width: 100%; padding: 12px; font-size: 15px;" onclick="closeSuccess()">Ойлголоо</button>
        </div>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        const products = [
            // Кофе & Уух зүйлс
            { id: 1, cat: 'coffee', title: 'Эспрессо', price: 6000, img: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=500', desc: 'Сэргээх чанартай 100% арабика шошны өтгөн эспрессо.', detail: 'Найрлага: 100% Арабика кофе. Хүчтэй амттай, өглөөг эрч хүчтэй эхлүүлэхэд хамгийн тохиромжтой.' },
            { id: 2, cat: 'coffee', title: 'Капучино', price: 8000, img: 'https://images.unsplash.com/photo-1534778101976-62847782c213?w=500', desc: 'Зөөлөн хөөстэй халуун капучино.', detail: 'Найрлага: Эспрессо шүүс, уурын халуун сүү болон өтгөн сүүн хөөс.' },
            { id: 3, cat: 'coffee', title: 'Латте', price: 8500, img: 'https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?w=500', desc: 'Зөөлөн амттай, их сүүтэй кофе.', detail: 'Найрлага: Торгомсог зөөлөн сүүтэй эспрессо кофе.' },
            { id: 4, cat: 'coffee', title: 'Манго Смузи', price: 9500, img: 'https://images.unsplash.com/photo-1553530666-ba11a7da3888?w=500', desc: 'Шинэхэн манго жимсний мөстэй смузи.', detail: 'Найрлага: Шинэхэн манго жимс, сүү, тараг ба мөс.' },

            // Ресторан
            { id: 5, cat: 'food', title: 'Классик Бургер', price: 22000, img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500', desc: 'Үхрийн махтай, бяслагтай шүүслэг бургер.', detail: 'Найрлага: Шинэхэн үхрийн мах, Чеддар бяслаг, нарийн ногоо болон шарсан төмс.' },
            { id: 6, cat: 'food', title: 'Маргарита Пицца', price: 32000, img: 'https://images.unsplash.com/photo-1604382355076-af4b0eb60143?w=500', desc: 'Итали маягийн Моццарелла бяслагтай пицца.', detail: 'Найрлага: Томатны сүмс, шинэ Моццарелла бяслаг, райхан навч.' },
            { id: 7, cat: 'food', title: 'Үхрийн махан Стейк', price: 38000, img: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=500', desc: 'Зөөлөн шарах шүүгээнд болгосон стейк.', detail: 'Найрлага: Шинэхэн үхрийн гол мах, шарсан ногоо, тусгай стейк сүмс.' },
            { id: 8, cat: 'food', title: 'Клаб Сэндвич', price: 18000, img: 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=500', desc: 'Тахианы мах, гахайн махтай давхар сэндвич.', detail: 'Найрлага: Шарсан тахианы цээж мах, гахайн мах, өндөг, нарийн ногоо.' },

            // Караоке
            { id: 9, cat: 'karaoke', title: 'Энгийн өрөө (1 цаг)', price: 40000, img: 'https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=500', desc: '4-6 хүний багтаамжтай тухтай өрөө.', detail: 'Онцлог: Төгс дуугаралттай караоке систем, иж бүрэн гэрэлтүүлэг.' },
            { id: 10, cat: 'karaoke', title: 'Медиум өрөө (1 цаг)', price: 60000, img: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500', desc: '6-10 хүний багтаамжтай өрөө.', detail: 'Онцлог: Өндөр зэрэглэлийн акустик орчин, гэрлийн систем.' },
            { id: 11, cat: 'karaoke', title: 'VIP өрөө (1 цаг)', price: 80000, img: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500', desc: '10-15 хүний өндөр зэрэглэлийн VIP өрөө.', detail: 'Онцлог: 4K дэлгэц, студийн микрофон, тусдаа ариун цэврийн өрөө.' },

            // Буудал
            { id: 12, cat: 'hotel', title: 'Энгийн өрөө (1 хоног)', price: 120000, img: 'https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=500', desc: '1-2 хүний тухтай цэвэрхэн өрөө.', detail: 'Давуу тал: Кинг-сайз ор, хурдан интернет, смарт ТВ, өглөөний цай багтсан.' },
            { id: 13, cat: 'hotel', title: 'Люкс өрөө (1 хоног)', price: 250000, img: 'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=500', desc: 'Тансаг зэрэглэлийн хоёр өрөө бүхий люкс.', detail: 'Давуу тал: Jacuzzi банн, хотын харагдацтай цонх, өглөөний цай багтсан.' },
            { id: 14, cat: 'hotel', title: 'Гэр бүлийн өрөө (1 хоног)', price: 180000, img: 'https://images.unsplash.com/photo-1566665797739-1674de7a421a?w=500', desc: '3-4 хүний багтаамжтай том өрөө.', detail: 'Давуу тал: Хоёр том ор, хүүхдэд ээлтэй орчин, бүх тухлаг нөхцөл.' }
        ];

        let cart = {};
        let currentFilter = 'all';
        let activeModalItem = null;

        function renderItems(filter = 'all') {
            currentFilter = filter;
            const container = document.getElementById('menu-items');
            container.innerHTML = '';
            
            const filtered = filter === 'all' ? products : products.filter(p => p.cat === filter);
            
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.setAttribute('data-aos', 'fade-up');
                card.onclick = (e) => {
                    if(!e.target.closest('button')) openModal(item);
                };

                card.innerHTML = `
                    <img class="item-img" src="${item.img}" alt="${item.title}">
                    <div class="item-info">
                        <div>
                            <div class="item-title">${item.title}</div>
                            <div class="item-desc">${item.desc}</div>
                        </div>
                        <div class="item-bottom">
                            <div class="item-price">${item.price.toLocaleString()} ₮</div>
                            <div id="card-action-${item.id}">
                                ${getCardActionHtml(item.id)}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function getCardActionHtml(id) {
            let qty = cart[id] || 0;
            if (qty === 0) {
                return `<button class="add-btn" onclick="changeQty(${id}, 1, event)">Сагслах</button>`;
            } else {
                return `
                    <div class="counter-box">
                        <button class="count-btn" onclick="changeQty(${id}, -1, event)">-</button>
                        <span class="count-num">${qty}</span>
                        <button class="count-btn" onclick="changeQty(${id}, 1, event)">+</button>
                    </div>
                `;
            }
        }

        function filterCategory(cat, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderItems(cat);
        }

        function changeQty(id, delta, event) {
            if(event) event.stopPropagation();
            cart[id] = (cart[id] || 0) + delta;
            if (cart[id] <= 0) {
                delete cart[id];
            }
            updateCart();

            const actionElem = document.getElementById(`card-action-${id}`);
            if (actionElem) {
                actionElem.innerHTML = getCardActionHtml(id);
            }
            
            if (activeModalItem && activeModalItem.id === id) {
                updateModalAction(activeModalItem);
            }
        }

        function openModal(item) {
            activeModalItem = item;
            document.getElementById('mImg').src = item.img;
            document.getElementById('mTitle').innerText = item.title;
            document.getElementById('mDetail').innerText = item.detail;
            document.getElementById('mPrice').innerText = item.price.toLocaleString() + ' ₮';
            updateModalAction(item);
            document.getElementById('itemModal').classList.add('active');
        }

        function updateModalAction(item) {
            let qty = cart[item.id] || 0;
            let area = document.getElementById('mActionArea');
            if (qty === 0) {
                area.innerHTML = `<button class="add-btn" style="padding: 10px 20px; font-size: 15px;" onclick="changeQty(${item.id}, 1)">Сагсанд нэмэх</button>`;
            } else {
                area.innerHTML = `
                    <div class="counter-box" style="padding: 6px 12px;">
                        <button class="count-btn" style="width: 32px; height: 32px; font-size: 16px;" onclick="changeQty(${item.id}, -1)">-</button>
                        <span class="count-num" style="font-size: 16px; margin: 0 8px;">${qty}</span>
                        <button class="count-btn" style="width: 32px; height: 32px; font-size: 16px;" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                `;
            }
        }

        function closeModal() {
            document.getElementById('itemModal').classList.remove('active');
            activeModalItem = null;
        }

        function closeModalBg(event) {
            if (event.target.id === 'itemModal') closeModal();
        }

        function updateCart() {
            let total = 0;
            for (let id in cart) {
                let item = products.find(p => p.id == id);
                if (item) total += item.price * cart[id];
            }
            document.getElementById('cartTotal').innerText = total.toLocaleString() + ' ₮';
        }

        function showReceipt() {
            const container = document.getElementById('receiptItems');
            container.innerHTML = '';
            let total = 0;
            for (let id in cart) {
                let item = products.find(p => p.id == id);
                if (!item) continue;
                let itemTotal = item.price * cart[id];
                total += itemTotal;
                container.innerHTML += `
                    <div style="display:flex; justify-content:space-between; margin:6px 0; font-size: 14px;">
                        <span>${item.title} x ${cart[id]}</span>
                        <span>${itemTotal.toLocaleString()} ₮</span>
                    </div>
                `;
            }
            
            const btn = document.getElementById('checkoutBtn');
            if(total === 0) {
                container.innerHTML = '<p style="text-align:center;">Сагс хоосон байна.</p>';
                btn.style.display = 'none';
            } else {
                btn.style.display = 'block';
            }
            
            document.getElementById('receiptTotal').innerText = total.toLocaleString() + ' ₮';
            document.getElementById('receiptModal').style.display = 'flex';
        }

        function closeReceipt() {
            document.getElementById('receiptModal').style.display = 'none';
        }

        function confirmOrder() {
            closeReceipt();
            cart = {};
            updateCart();
            renderItems(currentFilter);
            document.getElementById('successModal').style.display = 'flex';
        }

        function closeSuccess() {
            document.getElementById('successModal').style.display = 'none';
        }

        renderItems();
        AOS.init({ duration: 600, once: true });
    </script>
</body>
</html>
